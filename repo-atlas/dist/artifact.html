<title>Repo Village</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Pixelify+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: app shell. Sidebar (library, learning path, categories) + main column:
   a big living pixel village on top (one building per category), repo index below,
   detail drawer on the right. Deliberately dark-only and warm: lamplight around a village. */
:root{
  --ground:#15110d;     /* page: night soil */
  --panel:#1d1813;      /* raised surfaces */
  --panel-2:#272019;    /* hover / inputs */
  --line:#30271f;       /* hairlines */
  --line-2:#43372b;     /* stronger borders */
  --ink:#f6ecdb;        /* primary text */
  --ink-2:#cbbba1;      /* secondary text */
  --ink-3:#917f68;      /* tertiary text */
  --ion:#f2b544;        /* accent: lamplight */
  --ion-a:rgba(242,181,68,.16);
  --amber:#a8d86e;      /* start-here picks: sprout green */
  --amber-a:rgba(168,216,110,.14);
  --ok:#5fd39a; --bad:#ff7a7a;
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-pix:"Pixelify Sans",var(--f-mono,ui-monospace),monospace;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
  --rail:264px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{margin:0;font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);background:var(--ground);
  padding-block:18px 24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:var(--f-pix);font-size:19px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;margin-top:-1px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav h3{margin:0 0 6px;padding:0 10px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);text-align:left;font-size:13.5px;transition:background .12s,color .12s}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--h);box-shadow:0 0 0 3px color-mix(in srgb,var(--h) 18%,transparent)}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .ct{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.nav-item .step{width:18px;height:18px;border-radius:5px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);flex:none}
.nav-item[aria-current="true"] .step{border-color:var(--amber);color:var(--amber)}
.rail-foot{margin-top:auto;padding:0 10px;font-size:11.5px;color:var(--ink-3);line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){.gut{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(21,17,13,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;height:64px}
.btn.menu-btn{display:none}
.search{position:relative;flex:1;min-width:0;max-width:720px;margin-right:auto}
.search svg.i{position:absolute;left:13px;top:50%;translate:0 -50%;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);padding:0 64px 0 38px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--ion);background:var(--panel-2);box-shadow:0 0 0 3px var(--ion-a)}
.search input::-webkit-search-cancel-button{display:none}
.search .keys{position:absolute;right:8px;top:50%;translate:0 -50%;display:flex;gap:4px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--ground)}
.clear{border:0;background:var(--panel-2);color:var(--ink-2);border-radius:6px;height:24px;padding:0 8px;font-size:12px}
.btn{height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:border-color .12s,background .12s,filter .12s}
.btn:hover{background:var(--panel-2);border-color:#5a4a3a}
.btn.pri{background:var(--ion);color:#2a1a06;border-color:var(--ion)}
.btn.pri:hover{filter:brightness(.9)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.icon{width:40px;padding:0}
.spacer{flex:1}

/* ---------- village ---------- */
.viz{position:relative;margin-top:18px;border:2px solid #2a1f15;border-radius:6px;overflow:hidden;background:#4b6f2a;box-shadow:0 0 0 1px var(--line-2),0 18px 50px rgba(0,0,0,.45)}
.viz canvas{display:block;width:100%;height:520px;touch-action:pan-y;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-select:none;user-select:none}
.viz .hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plank{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:5px 11px;background:#4a311b;color:#f6e7c8;border:2px solid #1f150c;box-shadow:inset 0 2px 0 #5e3f23;font-family:var(--f-pix);font-size:13px;line-height:1.1}
.plank small{display:block;font-size:11px;color:#d8c29c;font-family:var(--f-pix)}
.hud-title{font-size:15px}
.hud-left{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.jump{display:none}
.hud-stats{font-size:11.5px;color:#d8c29c;margin-top:2px}
button.plank{cursor:pointer}
button.plank:hover{background:#5a3c21}
.plank .sun{width:9px;height:9px;flex:none;box-shadow:0 0 0 2px #1f150c}
.focus-chip{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 5px 4px 10px;background:#4a311b;color:#f6e7c8;border:2px solid #1f150c;box-shadow:inset 0 2px 0 #5e3f23;font-family:var(--f-pix);font-size:13px}
.focus-chip button{border:2px solid #1f150c;background:#f2b544;color:#2a1a06;height:24px;padding:0 9px;font-family:var(--f-pix);font-size:12px}
.hint{pointer-events:none;font-family:var(--f-pix);font-size:12px;color:#fff3da;text-shadow:0 1px 0 #1f150c,0 0 6px rgba(0,0,0,.6)}
.tip{position:absolute;z-index:4;pointer-events:none;min-width:190px;max-width:290px;padding:9px 11px;background:#2a1d12;border:2px solid #120c07;box-shadow:inset 0 0 0 1px #5e3f23,0 10px 30px rgba(0,0,0,.5);font-size:12.5px;color:#f6ecdb}
.tip b{display:block;font-family:var(--f-pix);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tip p{margin:3px 0 0;color:#d8c29c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tip .m{margin-top:6px;font-family:var(--f-mono);font-size:11px;color:#b9a27e}
.pix{font-family:var(--f-pix)!important;font-weight:600!important;letter-spacing:0!important}
.b-hero{display:flex;gap:14px;align-items:center;min-width:0}
.b-pic{flex:none;width:112px;height:96px;display:grid;place-items:center;background:#4b6f2a;border:2px solid #1f150c;box-shadow:inset 0 0 0 1px #6f9a3e;overflow:hidden}
.b-pic canvas{max-width:104px;max-height:88px;width:auto;height:auto;image-rendering:pixelated}
.b-hero h2{margin:2px 0 2px;font-size:24px;line-height:1.1}
.b-hero p{margin:0;font-size:13px;color:var(--ink-2)}
.b-cat{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.b-cat i{width:8px;height:8px;background:var(--h)}
/* ---------- results header ---------- */
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;padding-top:30px;padding-bottom:14px}
.rhead h1{margin:0;font-family:var(--f-pix);font-size:28px;font-weight:600;letter-spacing:0;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.rhead p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.rhead .ttl{min-width:0}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.seg button{height:28px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.seg .ct{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.sel{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font-size:12.5px;color:var(--ink-2)}
.check{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.check input{accent-color:var(--ion);margin:0}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;padding-bottom:20px}
.card{position:relative;min-width:0;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .14s,background .14s,transform .14s}
.card:hover{border-color:var(--line-2);background:#211b15}
.card:active{transform:scale(.995)}
.card.flash{border-color:var(--ion);box-shadow:0 0 0 3px var(--ion-a)}
.c-head{display:flex;align-items:center;gap:11px;min-width:0}
.mono-tile{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--h);background:color-mix(in srgb,var(--h) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--h) 28%,transparent);text-transform:uppercase}
.c-title{min-width:0;flex:1;line-height:1.25}
.c-owner{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-stars{flex:none;display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.c-stars svg{width:13px;height:13px;fill:var(--ion);stroke:none}
.c-desc{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:3em}
.c-desc.none{color:var(--ink-3);font-style:italic}
.c-foot{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:auto}
.c-foot .lang i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;letter-spacing:.01em}
.pill.pick{color:var(--amber);background:var(--amber-a)}
.pill.mine{color:var(--ion);background:var(--ion-a)}
.pill.pend{color:var(--ink-3);background:var(--panel-2)}
.save{margin-left:auto;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.save:hover{border-color:var(--line-2);color:var(--ink)}
.save svg{width:15px;height:15px}
.save[aria-pressed="true"]{color:var(--amber)}
.save[aria-pressed="true"] svg{fill:var(--amber)}
.more{display:flex;justify-content:center;padding:8px 0 48px}
.empty{grid-column:1/-1;padding:56px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:12px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:6px}
.foot{border-top:1px solid var(--line);padding-block:20px 36px;color:var(--ink-3);font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(3,4,6,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line-2);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-30px 0 80px rgba(0,0,0,.5);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.d-top .crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-body>*{flex-shrink:0}
.d-body{flex:1;overflow-y:auto;padding:22px 20px 28px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.d-id{display:flex;gap:14px;align-items:center;min-width:0}
.d-id .mono-tile{width:48px;height:48px;border-radius:12px;font-size:16px}
.d-id h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.d-id span{font-size:13px;color:var(--ink-3)}
.d-desc{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6;overflow-wrap:anywhere}
.d-note{margin:0;padding:10px 12px;border-radius:8px;background:var(--amber-a);color:var(--amber);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{padding:11px 12px;border-right:1px solid var(--line);min-width:0}
.stats div:last-child{border-right:0}
.stats small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stats b{display:block;margin-top:2px;font-family:var(--f-mono);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-sec h4{margin:0 0 9px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--line-2);background:transparent;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink);border-color:#5a4a3a;background:var(--panel-2)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--h)}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.d-actions .btn{flex:1 1 auto}
.clone{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:9px;background:var(--ground);border:1px solid var(--line)}
.clone code{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;overflow-x:auto;scrollbar-width:none;user-select:all}
.rel{display:flex;flex-direction:column;gap:2px}
.rel button{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;text-align:left}
.rel button:hover{background:var(--panel-2)}
.rel .mono-tile{width:28px;height:28px;border-radius:7px;font-size:11px}
.rel .t{flex:1;min-width:0}
.rel .t b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .s{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}

.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.panel{pointer-events:auto;width:min(500px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.panel h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.panel p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--ground);padding:0 12px;font-size:14px;outline:none}
.field textarea{height:76px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ion);box-shadow:0 0 0 3px var(--ion-a)}
.status{min-height:18px;font-size:12.5px;color:var(--ink-3)}
.status.ok{color:var(--ok)}.status.err{color:var(--bad)}
.row-end{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;padding:9px 14px;border-radius:9px;background:var(--ink);color:#0a0b0e;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .18s ease}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:80;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:30px 0 80px rgba(0,0,0,.5)}
  .rail.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  .top-in{height:60px}
  .search .keys .kbd{display:none}
  .search input{padding-right:52px}
  .add-txt{display:none}
  .btn.add{width:40px;padding:0}
  .viz{margin-top:14px}
  .viz canvas{height:clamp(300px,58vh,440px)}
  .legend{display:none}

<script>
(() => {
"use strict";
const RAW = JSON.parse(document.getElementById("data").textContent);
const CATS = RAW.categories;
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- colour: one hue per category, evenly spaced, equal lightness ---------- */
function hsl(h, s, l){ s/=100; l/=100; const k = n => (n + h/30) % 12, a = s*Math.min(l, 1-l), f = n => l - a*Math.max(-1, Math.min(k(n)-3, 9-k(n), 1)); return [f(0), f(8), f(4)].map(v => Math.round(v*255)); }
const RGB = { python:[126,196,104], learn:[214,128,92], homelab:[214,86,66], devops:[82,160,214], linux:[196,214,228], network:[236,98,84],
  security:[184,172,160], ai:[168,132,228], web:[242,170,72], data:[226,196,98], systems:[244,128,56], tools:[184,132,80],
  awesome:[238,204,118], health:[150,206,98], rising:[250,204,64] };
CATS.forEach(c => { if (!RGB[c.id]) RGB[c.id] = [200,180,150]; });
const rgb = (id, a = 1) => { const [r,g,b] = RGB[id] || [160,170,190]; return a === 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a})`; };
const LANG = {Python:"#3572A5",JavaScript:"#f1e05a",TypeScript:"#3178c6",Go:"#00ADD8",Rust:"#dea584",C:"#8a8a8a","C++":"#f34b7d",Java:"#b07219",Shell:"#89e051",HTML:"#e34c26",CSS:"#663399",Ruby:"#cc342d",PHP:"#4F5D95",Kotlin:"#A97BFF",Swift:"#F05138","C#":"#178600",Dart:"#00B4AB",Lua:"#3d6fcf","Jupyter Notebook":"#DA5B0B",Vue:"#41b883",Zig:"#ec915c",Nix:"#7e7eff",Markdown:"#6b7180"};

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cortex:"+k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("cortex:"+k, JSON.stringify(v)); }catch{} }
};
let saved = new Set(store.get("saved", []));
let added = new Map();
let db = null;

/* ---------- data ---------- */
function norm(r){
  const i = r.n.indexOf("/");
  r.owner = r.n.slice(0, i); r.name = r.n.slice(i+1);
  r.t = Array.isArray(r.t) ? r.t : [];
  r.nameL = r.n.toLowerCase();
  r.topicsL = r.t.join(" ").toLowerCase();
  r.hay = (r.n + " " + (r.d||"") + " " + r.t.join(" ") + " " + (r.l||"") + " " + r.cats.map(c => CAT[c]?.name || c).join(" ") + " " + (r.note||"")).toLowerCase();
  return r;
}
const BASE = RAW.repos.map(norm);
let ALL = BASE;
function rebuildAll(){
  if (!added.size){ ALL = BASE; return; }
  const ids = new Set(BASE.map(r => r.nameL));
  ALL = BASE.concat([...added.values()].filter(r => !ids.has(r.nameL)));
}
const byId = id => ALL.find(r => r.nameL === id);

/* ---------- formatting ---------- */
const fmtStars = n => n == null ? "–" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/,"")+"k" : String(n);
const NOW = Date.now();
function ago(iso){
  if (!iso) return "–";
  const d = Math.max(0, Math.round((NOW - Date.parse(iso)) / 864e5));
  if (d < 1) return "today"; if (d < 31) return d+"d ago"; if (d < 365) return Math.round(d/30.4)+"mo ago";
  const y = d/365; return (y < 10 ? y.toFixed(1).replace(/\.0$/,"") : Math.round(y)) + "y ago";
}
const initials = r => (r.name.replace(/[^A-Za-z0-9]/g, "").slice(0, 2) || r.name.slice(0, 2));
const tile = (r, cls = "") => `<span class="mono-tile ${cls}" style="--h:${rgb(r.cats[0])}" aria-hidden="true">${esc(initials(r))}</span>`;

/* ---------- state ---------- */
const PATH = [
  { cat:"python",   title:"Python foundations" },
  { cat:"linux",    title:"Linux & the terminal" },
  { cat:"network",  title:"Networking basics" },
  { cat:"homelab",  title:"Build the homelab" },
  { cat:"devops",   title:"Containers & automation" },
  { cat:"security", title:"Defend & harden" },
  { cat:"health",   title:"Body: train & eat" },
];
const S = { q:"", cat:null, view:"all", fresh:false, sort:"match", limit:48, lib:null };

let results = [];
function score(r, toks){
  let s = 0;
  for (const t of toks){
    if (!r.hay.includes(t)) return -1;
    if (r.name.toLowerCase() === t) s += 14;
    else if (r.name.toLowerCase().startsWith(t)) s += 8;
    else if (r.nameL.includes(t)) s += 5;
    if (r.topicsL.includes(t)) s += 3;
    s += 1;
  }
  return s + Math.log10((r.s||0) + 10) * 1.3 + (r.k ? 2 : 0);
}
function compute(){
  const toks = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const cutoff = NOW - 30*864e5;
  const out = [];
  for (const r of ALL){
    if (S.cat && !r.cats.includes(S.cat)) continue;
    if (S.view === "picks" && !r.k) continue;
    if (S.view === "saved" && !saved.has(r.nameL)) continue;
    if (S.lib === "added" && !r.a) continue;
    if (S.fresh && !(r.p && Date.parse(r.p) >= cutoff)) continue;
    let sc;
    if (toks.length){ sc = score(r, toks); if (sc < 0) continue; }
    else sc = (r.k && (S.cat || S.view === "picks") ? 1e9 : 0) + (r.s || 0) + (r.a ? 2e9 : 0);
    r._sc = sc; out.push(r);
  }
  const key = S.sort === "match" ? "_sc" : {stars:"s", pushed:"p", created:"c"}[S.sort];
  out.sort((a, b) => { const x = a[key] ?? "", y = b[key] ?? ""; return x < y ? 1 : x > y ? -1 : (b.s||0) - (a.s||0); });
  results = out;
  return out;
}

/* ---------- sidebar ---------- */
function renderRail(){
  const counts = {};
  for (const r of ALL) for (const c of r.cats) counts[c] = (counts[c]||0) + 1;
  const picks = {};
  for (const r of ALL) if (r.k) for (const c of r.cats) picks[c] = (picks[c]||0) + 1;
  $("cats").innerHTML = CATS.map(c => `<button class="nav-item" type="button" data-cat="${c.id}" aria-current="${S.cat === c.id && S.view !== "picks"}" style="--h:${rgb(c.id)}"><span class="dot"></span><span class="lbl">${esc(c.name)}</span><span class="ct num">${counts[c.id]||0}</span></button>`).join("");
  $("path").innerHTML = PATH.filter(p => CAT[p.cat]).map((p, i) => `<button class="nav-item" type="button" data-path="${p.cat}" aria-current="${S.cat === p.cat && S.view === "picks"}"><span class="step">${i+1}</span><span class="lbl">${esc(p.title)}</span><span class="ct num">${picks[p.cat]||0}</span></button>`).join("");
  $("ctAll").textContent = ALL.length.toLocaleString();
  $("ctSaved").textContent = saved.size || "";
  $("ctAdded").textContent = added.size || "";
  const lib = !S.cat && !S.q ? (S.lib === "added" ? "added" : S.view === "saved" ? "saved" : S.view === "all" ? "all" : "") : "";
  document.querySelectorAll("[data-nav]").forEach(b => b.setAttribute("aria-current", b.dataset.nav === lib));
}

/* ---------- cards ---------- */
function card(r){
  const isSaved = saved.has(r.nameL);
  const lang = r.l ? `<span class="lang"><i style="background:${LANG[r.l] || "#6b7180"}"></i>${esc(r.l)}</span>` : "";
  const badge = r.k ? `<span class="pill pick">Start here</span>` : r.a ? `<span class="pill ${r.pending ? "pend" : "mine"}">${r.pending ? "Details pending" : "Added"}</span>` : "";
  const desc = r.d ? `<p class="c-desc">${esc(r.d)}</p>` : `<p class="c-desc none">${r.a ? "Added by you. Description loads once GitHub is reachable." : "No description."}</p>`;
  return `<article class="card" data-id="${esc(r.nameL)}" tabindex="0" aria-label="${esc(r.n)}">
    <div class="c-head">${tile(r)}<div class="c-title"><span class="c-owner">${esc(r.owner)}</span><span class="c-name">${esc(r.name)}</span></div><span class="c-stars num">${STAR}${fmtStars(r.s)}</span></div>
    ${desc}
    <div class="c-foot">${badge}${lang}<span>${r.p ? "Updated " + ago(r.p) : ""}</span><button class="save" type="button" aria-pressed="${isSaved}" aria-label="${isSaved ? "Remove from saved" : "Save"} ${esc(r.n)}">${STAR_O}</button></div>
  </article>`;
}
function renderHead(n){
  let t, sub;
  const pathStep = S.view === "picks" && S.cat ? PATH.findIndex(p => p.cat === S.cat) : -1;
  if (S.q) { t = `Results for “${S.q}”`; sub = S.cat ? `in ${CAT[S.cat].name}` : "across every category"; }
  else if (pathStep >= 0) { t = `Step ${pathStep+1}: ${PATH[pathStep].title}`; sub = `Hand-picked starting points in ${CAT[S.cat].name}. Start at the top.`; }
  else if (S.cat) { t = CAT[S.cat].name; sub = CAT[S.cat].desc; }
  else if (S.lib === "added") { t = "Added by you"; sub = "Repos you added with a GitHub link."; }
  else if (S.view === "saved") { t = "Saved"; sub = "Repos you starred in this browser."; }
  else if (S.view === "picks") { t = "Start here"; sub = "The hand-picked learning path, every step."; }
  else { t = "All repositories"; sub = `The most-starred and fastest-rising repos on GitHub, pulled ${RAW.generated}.`; }
  $("rTitle").textContent = t;
  $("rSub").textContent = `${n.toLocaleString()} repo${n === 1 ? "" : "s"} · ${sub}`;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
}
function render(){
  const res = compute();
  const shown = res.slice(0, S.limit);
  let empty;
  if (S.view === "saved" && !saved.size) empty = `<b>Nothing saved yet</b>Tap the star on any repo to keep it here.`;
  else if (S.lib === "added" && !added.size) empty = `<b>You haven't added a repo yet</b>Use Add repo and paste a GitHub link.`;
  else empty = `<b>No repo matches that</b>Try a shorter word, clear the category, or add it yourself with Add repo.`;
  $("grid").innerHTML = shown.length ? shown.map(card).join("") : `<div class="empty">${empty}</div>`;
  const left = res.length - S.limit;
  $("more").hidden = left <= 0;
  $("more").textContent = `Show ${Math.min(48, left)} more · ${left.toLocaleString()} left`;
  $("clearQ").hidden = !S.q; $("kbdHint").hidden = !!S.q;
  renderHead(res.length);
  renderRail();
  net.update(res);
}

  const top = list.filter(r => !r.k).sort((a, b) => (b.s||0) - (a.s||0)).slice(0, 30);
  const fresh = list.filter(r => r.p && Date.parse(r.p) > NOW - 14*864e5).length;
  const row = x => `<button type="button" data-rel="${esc(x.nameL)}">${tile(x)}<span class="t"><b>${esc(x.n)}</b><span>${esc(x.d || "")}</span></span><span class="s num">★ ${fmtStars(x.s)}</span></button>`;
  $("dCrumb").textContent = "Village · " + net.name(id);
  $("dBody").innerHTML = `
    <div class="b-hero"><div class="b-pic" id="bPic"></div><div style="min-width:0"><span class="b-cat" style="--h:${rgb(id)}"><i></i>${esc(c.name)}</span><h2 id="dTitle" class="pix">${esc(net.name(id))}</h2><p>${esc(c.desc)}</p></div></div>
    <div class="stats num"><div><small>Repos</small><b>${list.length}</b></div><div><small>Start here</small><b>${picks.length}</b></div><div><small>Active 14d</small><b>${fresh}</b></div><div><small>Top stars</small><b>${fmtStars(list.reduce((m, r) => Math.max(m, r.s||0), 0))}</b></div></div>
    <div class="d-actions"><button class="btn pri" type="button" data-allcat="${id}">Show all ${list.length} in the list</button></div>
    ${picks.length ? `<div class="d-sec"><h4>Start here</h4><div class="rel">${picks.map(row).join("")}</div></div>` : ""}
    <div class="d-sec"><h4>Most starred</h4><div class="rel">${top.map(row).join("")}</div></div>
  `;
  const pic = net.snapshot(id, 4); if (pic) $("bPic").appendChild(pic);
  $("drawer").hidden = false; $("scrim").hidden = false;
  $("dBody").scrollTop = 0;
  $("dClose").focus();
}


/* ---------- navigation ---------- */
function setCat(c, opt = {}){
  S.cat = c || null; S.limit = 48; S.lib = null;
  if (!opt.keepView && S.view === "saved") S.view = "all";
  try{ history.replaceState(null, "", c ? "#" + c : location.pathname + location.search); }catch{}
  render();
}
function closeRail(){ $("rail").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); if ($("drawer").hidden && $("addModal").hidden) $("scrim").hidden = true; }
function openRail(){ $("rail").classList.add("open"); $("menuBtn").setAttribute("aria-expanded", "true"); $("scrim").hidden = false; }
function toResults(){ const y = document.querySelector(".rhead").getBoundingClientRect().top + scrollY - 70; if (scrollY > y) scrollTo({ top:y, behavior: reduceMotion ? "auto" : "smooth" }); }

$("rail").addEventListener("click", e => {
  const b = e.target.closest("button, a"); if (!b) return;
  if (b.dataset.cat){ S.view = "all"; setCat(S.cat === b.dataset.cat && S.view === "all" ? null : b.dataset.cat); }
  else if (b.dataset.path){ S.view = "picks"; setCat(b.dataset.path, { keepView:true }); }
  else if (b.dataset.nav){
    S.q = ""; $("q").value = "";
    S.view = b.dataset.nav === "saved" ? "saved" : "all";
    setCat(null, { keepView:true });
    S.lib = b.dataset.nav === "added" ? "added" : null;
    render();
  } else return;
  closeRail();
});
$("home").addEventListener("click", e => { e.preventDefault(); S.q = ""; $("q").value = ""; S.view = "all"; S.fresh = false; $("fresh").checked = false; setCat(null); closeRail(); scrollTo({ top:0 }); });
$("menuBtn").addEventListener("click", () => $("rail").classList.contains("open") ? closeRail() : openRail());
document.addEventListener("click", e => { if (e.target.id === "zoomOut") setCat(null, { keepView:true }); });

let qt;
$("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); S.limit = 48; S.lib = null; render(); }, 80); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("q").blur(); toResults(); } });
$("clearQ").addEventListener("click", () => { $("q").value = ""; S.q = ""; render(); $("q").focus(); });
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (!b) return; S.view = b.dataset.view; S.lib = null; S.limit = 48; render(); });
$("fresh").addEventListener("change", e => { S.fresh = e.target.checked; S.limit = 48; render(); });
$("sort").addEventListener("change", e => { S.sort = e.target.value; render(); });
$("more").addEventListener("click", () => { S.limit += 48; render(); });

function toggleSave(id){
  saved.has(id) ? saved.delete(id) : saved.add(id);
  store.set("saved", [...saved]);
  toast(saved.has(id) ? "Saved" : "Removed from saved");
}
$("grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const id = c.dataset.id;
  if (e.target.closest(".save")){
    toggleSave(id);
    const on = saved.has(id), btn = e.target.closest(".save");
    btn.setAttribute("aria-pressed", on);
    if (S.view === "saved") render(); else renderRail();
    return;
  }
  const r = byId(id); if (r) openDrawer(r, c);
});
$("grid").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")){ e.preventDefault(); const r = byId(e.target.dataset.id); if (r) openDrawer(r, e.target); } });

addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if ((e.key === "/" && !typing) || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))){ e.preventDefault(); $("q").focus(); $("q").select(); }
  if (e.key === "Escape"){
    if (!$("addModal").hidden) closeAdd();
    else if (!$("drawer").hidden) closeDrawer();
    else if ($("rail").classList.contains("open")) closeRail();
    else if (document.activeElement === $("q") && S.q){ $("q").value = ""; S.q = ""; render(); }
    else if (S.cat) setCat(null, { keepView:true });
  }
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (CAT[h] && S.cat !== h){ S.cat = h; render(); } });
$("scrim").addEventListener("click", () => { closeDrawer(); closeRail(); closeAdd(); });

/* ---------- toast ---------- */
let tt;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1600); }

/* ---------- detail drawer ---------- */
let lastFocus = null, current = null, currentCat = null, currentBack = null;
function related(r){
  const tops = new Set(r.t);
  return ALL.filter(x => x !== r).map(x => {
    let s = 0; for (const t of x.t) if (tops.has(t)) s += 2;
    for (const c of x.cats) if (r.cats.includes(c)) s += 1;
    return [x, s + Math.log10((x.s||0)+10)*.4];
  }).filter(([, s]) => s > 2).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([x]) => x);
}
function openDrawer(r, from, back){
  current = r; currentBack = back || null; currentCat = null;
  if (!lastFocus) lastFocus = from || document.activeElement;
  const isSaved = saved.has(r.nameL);
  const cats = r.cats.map(c => `<button class="chip" type="button" data-dcat="${c}" style="--h:${rgb(c)}"><i></i>${esc(CAT[c]?.name || c)}</button>`).join("");
  const topics = r.t.map(t => `<button class="chip" type="button" data-dq="${esc(t)}">${esc(t)}</button>`).join("");
  const rel = related(r);
  const clone = `git clone https://github.com/${r.n}.git`;
  $("dCrumb").textContent = r.cats.map(c => CAT[c]?.name || c).join(" · ");
  $("dBody").innerHTML = `
    ${currentBack ? `<button class="btn sm" type="button" data-back="${currentBack}" style="align-self:flex-start"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back to ${esc(net.name(currentBack))}</button>` : ""}
    <div class="d-id">${tile(r)}<div style="min-width:0"><span>${esc(r.owner)}</span><h2 id="dTitle">${esc(r.name)}</h2></div></div>
    ${r.k || r.a ? `<div class="chips">${r.k ? `<span class="pill pick">Start here pick</span>` : ""}${r.a ? `<span class="pill ${r.pending ? "pend" : "mine"}">${r.pending ? "Added · details pending" : "Added by you"}</span>` : ""}</div>` : ""}
    ${r.d ? `<p class="d-desc">${esc(r.d)}</p>` : `<p class="d-desc" style="color:var(--ink-3)">No description yet.</p>`}
    ${r.note ? `<p class="d-note">${esc(r.note)}</p>` : ""}
    <div class="stats num"><div><small>Stars</small><b>${fmtStars(r.s)}</b></div><div><small>Language</small><b>${esc(r.l || "–")}</b></div><div><small>Updated</small><b>${ago(r.p)}</b></div><div><small>Since</small><b>${r.c ? r.c.slice(0, 4) : "–"}</b></div></div>
    <div class="d-actions">
      <a class="btn pri" href="https://github.com/${esc(r.n)}" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open on GitHub</a>
      <button class="btn" type="button" id="dSave" aria-pressed="${isSaved}">${STAR_O}<span>${isSaved ? "Saved" : "Save"}</span></button>
      ${r.a ? `<button class="btn" type="button" id="dRemove"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Remove</button>` : ""}
    </div>
    <div class="d-sec"><h4>Clone</h4><div class="clone"><code id="cloneCmd">${esc(clone)}</code><button class="btn sm" type="button" id="dCopy">Copy</button></div></div>
    ${topics ? `<div class="d-sec"><h4>Topics</h4><div class="chips">${topics}</div></div>` : ""}
    <div class="d-sec"><h4>Categories</h4><div class="chips">${cats}</div></div>
    ${rel.length ? `<div class="d-sec"><h4>Related</h4><div class="rel">${rel.map(x => `<button type="button" data-rel="${esc(x.nameL)}">${tile(x)}<span class="t"><b>${esc(x.n)}</b><span>${esc(x.d || "")}</span></span><span class="s num">★ ${fmtStars(x.s)}</span></button>`).join("")}</div></div>` : ""}
  `;
  $("drawer").hidden = false; $("scrim").hidden = false;
  $("dBody").scrollTop = 0;
  $("dClose").focus();
}
function closeDrawer(){
  if ($("drawer").hidden) return;
  $("drawer").hidden = true; current = null; currentCat = null; currentBack = null;
  if (!$("rail").classList.contains("open") && $("addModal").hidden) $("scrim").hidden = true;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}
$("dClose").addEventListener("click", closeDrawer);
$("dBody").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.back){ openCategory(b.dataset.back); return; }
  if (b.dataset.allcat){ const c = b.dataset.allcat; closeDrawer(); S.view = "all"; S.q = ""; $("q").value = ""; setCat(c); toResults(); return; }
  if (b.dataset.rel && !current){ const r = byId(b.dataset.rel); if (r) openDrawer(r, null, currentCat); return; }
  if (!current) return;
  if (b.id === "dSave"){ toggleSave(current.nameL); const on = saved.has(current.nameL); b.setAttribute("aria-pressed", on); b.querySelector("span").textContent = on ? "Saved" : "Save"; S.view === "saved" ? render() : (renderRail(), syncCardSave(current.nameL)); }
  else if (b.id === "dCopy"){
    const txt = $("cloneCmd").textContent;
    try{ await navigator.clipboard.writeText(txt); toast("Clone command copied"); }
    catch{ const rng = document.createRange(); rng.selectNodeContents($("cloneCmd")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rng); toast("Selected. Press Ctrl+C to copy."); }
  }
  else if (b.id === "dRemove"){ const id = current.nameL; closeDrawer(); await removeAdded(id); toast("Removed"); }
  else if (b.dataset.dq){ const q = b.dataset.dq; closeDrawer(); $("q").value = q; S.q = q; S.cat = null; S.limit = 48; render(); toResults(); }
  else if (b.dataset.dcat){ const c = b.dataset.dcat; closeDrawer(); S.view = "all"; setCat(c); toResults(); }
  else if (b.dataset.rel){ const r = byId(b.dataset.rel); if (r) openDrawer(r, null, currentBack); }
});
function syncCardSave(id){ const btn = document.querySelector(`.card[data-id="${CSS.escape(id)}"] .save`); if (btn) btn.setAttribute("aria-pressed", saved.has(id)); }
// keep focus inside the drawer / add dialog
document.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const box = !$("addModal").hidden ? $("addForm") : !$("drawer").hidden ? $("drawer") : null;
  if (!box) return;
  const f = [...box.querySelectorAll("a[href],button:not([disabled]),input,select,textarea")].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
});

/* ---------- add repo ---------- */
$("addCat").innerHTML = CATS.filter(c => c.id !== "rising").map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
function openAdd(){
  closeDrawer(); closeRail();
  $("addModal").hidden = false; $("scrim").hidden = false;
  $("addStatus").textContent = ""; $("addStatus").className = "status";
  if (S.cat && S.cat !== "rising") $("addCat").value = S.cat;
  setTimeout(() => $("addUrl").focus(), 20);
}
function closeAdd(){ if ($("addModal").hidden) return; $("addModal").hidden = true; if ($("drawer").hidden && !$("rail").classList.contains("open")) $("scrim").hidden = true; $("openAdd").focus(); }
$("openAdd").addEventListener("click", openAdd);
$("cancelAdd").addEventListener("click", closeAdd);
function parseRepo(s){
  s = String(s || "").trim().replace(/\.git$/, "").replace(/[?#].*$/, "").replace(/\/+$/, "");
  const m = s.match(/github\.com[/:]([A-Za-z0-9-]{1,39})\/([A-Za-z0-9._-]{1,100})/i) || s.match(/^([A-Za-z0-9-]{1,39})\/([A-Za-z0-9._-]{1,100})$/);
  return m ? m[1] + "/" + m[2] : null;
}
async function githubMeta(full){
  // Works when the app is hosted on its own. Inside a claude.ai artifact outside requests are blocked,
  // so the repo is saved with its link and the details are filled in later.
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000);
  try{
    const res = await fetch("https://api.github.com/repos/" + full, { signal:ctl.signal, headers:{ Accept:"application/vnd.github+json" } });
    if (res.status === 404) return { missing:true };
    if (!res.ok) return null;
    const j = await res.json();
    return { n:j.full_name, d:(j.description || "").slice(0, 220), s:j.stargazers_count, l:j.language || "", t:(j.topics || []).slice(0, 8), p:(j.pushed_at || "").slice(0, 10), c:(j.created_at || "").slice(0, 10) };
  }catch{ return null; } finally{ clearTimeout(t); }
}
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const st = $("addStatus"), full = parseRepo($("addUrl").value);
  if (!full){ st.className = "status err"; st.textContent = "That isn't a GitHub repo link. Use github.com/owner/repo."; $("addUrl").focus(); return; }
  const exists = ALL.find(r => r.nameL === full.toLowerCase());
  if (exists){ st.className = "status err"; st.textContent = `${exists.n} is already in the Cortex.`; return; }
  $("saveAdd").disabled = true; st.className = "status"; st.textContent = "Reading the repo from GitHub…";
  const meta = await githubMeta(full);
  if (meta?.missing){ $("saveAdd").disabled = false; st.className = "status err"; st.textContent = "GitHub says that repo doesn't exist or is private."; return; }
  const rec = Object.assign({ n:full, d:"", s:null, l:"", t:[], p:"", c:"" }, meta || {}, { cats:[$("addCat").value], note:$("addNote").value.trim().slice(0, 200), at:new Date().toISOString().slice(0, 10), pending: meta ? 0 : 1 });
  await saveAdded(rec);
  $("saveAdd").disabled = false;
  $("addUrl").value = ""; $("addNote").value = "";
  closeAdd();
  toast(`Added ${rec.n}`);
});
const docId = n => n.toLowerCase().replace("/", "__").replace(/[^a-z0-9._-]/g, "_");
function ingest(list){
  added = new Map();
  for (const x of list){
    if (!x || typeof x.n !== "string" || !parseRepo(x.n)) continue;
    const cats = (Array.isArray(x.cats) ? x.cats : []).filter(c => CAT[c]);
    const r = norm(Object.assign({}, x, { a:1, cats: cats.length ? cats : ["awesome"], s: typeof x.s === "number" ? x.s : null, d: typeof x.d === "string" ? x.d : "", l: typeof x.l === "string" ? x.l : "" }));
    added.set(r.nameL, r);
  }
  rebuildAll(); net.rebuild(); render();
}
async function saveAdded(rec){
  const plain = { n:rec.n, d:rec.d, s:rec.s, l:rec.l, t:rec.t, p:rec.p, c:rec.c, cats:rec.cats, note:rec.note, at:rec.at, pending:rec.pending };
  if (db){ try{ await db.collection("added").doc(docId(rec.n)).set(plain); return; } catch(err){ console.warn("Cloud save failed, keeping it in this browser.", err); } }
  const local = store.get("added", []).filter(x => x.n.toLowerCase() !== rec.n.toLowerCase());
  local.push(plain); store.set("added", local); ingest(local);
}
async function removeAdded(id){
  const r = added.get(id); if (!r) return;
  if (db){ try{ await db.collection("added").doc(docId(r.n)).delete(); return; } catch{} }
  const local = store.get("added", []).filter(x => x.n.toLowerCase() !== id);
  store.set("added", local); ingest(local);
}
async function connectStore(){
  const local = store.get("added", []);
  if (local.length) ingest(local);
  try{
    if (!window.claude?.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    db.collection("added").onSnapshot(snap => {
      const rows = []; snap.forEach(d => rows.push(d.data()));
      ingest(rows.concat(local.filter(l => !rows.some(r => r.n?.toLowerCase() === l.n.toLowerCase()))));
    }, err => console.warn("Could not read added repos.", err));
  }catch(err){ console.warn(err); }
}

/* ---------- boot ---------- */
const params = new URLSearchParams(location.search);
const h0 = location.hash.slice(1);
if (CAT[h0]) S.cat = h0;
if (params.get("q")){ S.q = params.get("q").slice(0, 80); $("q").value = S.q; }
if (/Mac|iPhone|iPad/.test(navigator.platform || "")) $("kbdHint").textContent = "⌘K";
$("foot").textContent = `${BASE.length.toLocaleString()} repos · ${CATS.length} categories · data pulled ${RAW.generated}`;
$("railFoot").textContent = `Data pulled ${RAW.generated}. Green "Start here" = hand-picked starting point.`;
net.build();
render();
connectStore();
})();
</script>
